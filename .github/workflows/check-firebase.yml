name: Check Firebase
on:
  push:
    branches: [main]
    paths: ['scripts/check-firebase.mjs', '.github/workflows/check-firebase.yml', 'web/index.html']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install --no-save firebase
      - run: node scripts/check-firebase.mjs
