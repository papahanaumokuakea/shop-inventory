<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<title>المخزن</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:PlexAr;src:url(fonts/ar-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:PlexAr;src:url(fonts/ar-500.woff2) format('woff2');font-weight:500 600;font-display:swap}
@font-face{font-family:PlexAr;src:url(fonts/ar-700.woff2) format('woff2');font-weight:700 900;font-display:swap}
@font-face{font-family:PlexLa;src:url(fonts/la-400.woff2) format('woff2');font-weight:400 600;font-display:swap}
@font-face{font-family:PlexLa;src:url(fonts/la-700.woff2) format('woff2');font-weight:700 900;font-display:swap}
:root{
  --bg:#f4f0e8; --card:#fffdf9; --ink:#1d2421; --muted:#7a807b; --line:#e8e0d3; --soft:#f2ede3;
  --accent:#1f5f57; --accent-2:#2d7a6f; --accent-ink:#ffffff; --accent-soft:#e2eeea;
  --gold:#b08546; --gold-soft:#f6ecda;
  --warn:#ad7719; --warn-soft:#f8eed8; --out:#b4564a; --out-soft:#f7e5e1; --good:#3a7f55; --good-soft:#e3f1e7;
  --r:20px; --nav:64px;
  --shadow:0 1px 1px rgba(45,35,15,.03),0 8px 24px rgba(45,35,15,.06);
  --sat:var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
  --sab:var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121614; --card:#1a1f1d; --ink:#ebe7df; --muted:#9aa19c; --line:#2a312e; --soft:#212725;
    --accent:#7bbfb2; --accent-2:#5aa596; --accent-ink:#0c1a17; --accent-soft:#1c2f2a; --gold:#d3ab6c; --gold-soft:#2d261a;
    --warn:#d6a44c; --warn-soft:#352c1c; --out:#d77f73; --out-soft:#3a2421; --good:#7bb68f; --good-soft:#1d3125; --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:PlexAr,PlexLa,system-ui,"Noto Sans Arabic",Tahoma,sans-serif;font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;
  padding-bottom:calc(var(--nav) + var(--sab) + 30px);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
input{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
::placeholder{color:var(--muted);opacity:.8}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(var(--sat) + 18px) 18px 12px;max-width:980px;margin:0 auto}
.hello{display:flex;align-items:center;gap:12px;min-width:0}
.av{width:46px;height:46px;border-radius:16px;background:linear-gradient(145deg,var(--accent-2),var(--accent));color:var(--accent-ink);display:grid;place-items:center;
  font-weight:700;font-size:21px;flex:none;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22),0 6px 16px rgba(31,95,87,.22)}
.greet{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.shop{font-size:21px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync[hidden]{display:none!important}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok{color:var(--good)}.sync.ok i{background:var(--good)}
.sync.wait{color:var(--warn)}.sync.wait i{background:var(--warn)}
.cloud{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;color:var(--muted);flex:none;box-shadow:var(--shadow)}
.cloud svg{width:18px;height:18px}
.cloud.ok{color:var(--good)}
.cloud.due{color:var(--warn);background:var(--warn-soft);border-color:transparent}

main{max-width:980px;margin:0 auto;padding:0 14px}
.view{display:none;animation:fade .18s ease}.view.on{display:block}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
h3{font-size:13.5px;font-weight:700;color:var(--muted);margin:22px 6px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}.small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:15px;padding:12px 16px;font-weight:600}
.btn svg{width:20px;height:20px;vertical-align:-5px;margin-inline-end:6px}
.btn.pri{background:linear-gradient(180deg,var(--accent-2),var(--accent));border-color:transparent;color:var(--accent-ink);box-shadow:0 6px 16px rgba(31,95,87,.20)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.danger{color:var(--out);border-color:var(--out-soft)}
.btn:disabled{opacity:.42;cursor:default;box-shadow:none}
.btn.wide{width:100%;padding:14px}
.row{display:flex;gap:10px;align-items:center}
.row > *{min-width:0}
.grow{flex:1}
.link{background:none;border:0;color:var(--accent);padding:4px;font-weight:600}
.iconbtn{background:none;border:0;color:var(--muted);padding:6px;border-radius:12px;display:inline-flex}
.iconbtn svg{width:20px;height:20px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;vertical-align:middle;margin-inline-start:5px}
.dot.low{background:var(--warn)}.dot.out{background:var(--out)}
.tag{font-size:11.5px;border-radius:999px;padding:1px 8px;white-space:nowrap;font-weight:600}
.tag.low{background:var(--warn-soft);color:var(--warn)}.tag.out{background:var(--out-soft);color:var(--out)}
.stack > *{margin-bottom:8px}

/* sell */
.search{display:flex;gap:8px}
.search .wrap{position:relative;flex:1}
.search .wrap svg{position:absolute;right:17px;top:50%;transform:translateY(-50%);width:21px;height:21px;color:var(--muted);pointer-events:none}
.search input{font-size:18px;padding:16px 50px 16px 16px;border-radius:20px;box-shadow:var(--shadow);border-color:transparent;background:var(--card)}
.search .kb{flex:none;width:60px;border-radius:20px;border:1px solid transparent;background:var(--card);font-weight:700;color:var(--muted);box-shadow:var(--shadow)}
.search .kb.on{color:var(--accent);background:var(--accent-soft)}
.results{margin-top:10px}
.res{display:flex;gap:12px;align-items:center;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 15px;margin-bottom:8px;box-shadow:var(--shadow)}
.res:active{transform:scale(.99)}
.res .ri{flex:1;min-width:0}
.res .ri b{display:block;font-weight:600;line-height:1.4}
.res .meta{display:block;font-size:12.5px;color:var(--muted)}
.res .rp{text-align:end;flex:none}
.res .rp .price{display:block;font-size:19px;font-weight:700;color:var(--accent)}
.res .rp .cost{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap}
.pick{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-top:12px;box-shadow:0 2px 2px rgba(45,35,15,.03),0 16px 36px rgba(45,35,15,.09);position:relative;overflow:hidden}
.pick::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--gold),var(--accent-2))}
.pick .name{font-size:18px;font-weight:700;line-height:1.4}
.pick .meta{font-size:13px;color:var(--muted)}
.pick .mid{display:flex;justify-content:space-between;align-items:center;margin:12px 0 4px}
.pick .big{font-size:28px;font-weight:700;color:var(--accent)}
.pstrip{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px;margin:12px 0 10px}
.pstrip div{background:var(--soft);border-radius:16px;padding:9px 8px;text-align:center}
.pstrip small{display:block;font-size:11.5px;color:var(--muted)}
.pstrip b{font-size:17px}
.pstrip .hl{background:var(--accent-soft);color:var(--accent)}
.pstrip .hl b{font-size:23px}
.salenote{font-size:12.5px;color:var(--muted);margin:2px 2px 12px;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.stepper button{width:46px;height:48px;border:0;background:none;font-size:22px;color:var(--ink)}
.stepper input{width:52px;border:0;text-align:center;font-weight:700;font-size:18px;padding:0;box-shadow:none;background:transparent}
.sellrow{display:flex;gap:10px;align-items:center}
.sellrow .btn.pri{flex:1;font-size:19px;padding:13px;border-radius:18px}
.warnline{font-size:13px;color:var(--out);margin-top:10px}
.today .t{display:flex;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px solid var(--line)}
.today .t:last-child{border-bottom:0}
.today .t .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.today .t .tm{font-size:12px;color:var(--muted);width:54px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.sum div{background:var(--soft);border-radius:14px;padding:8px 10px;font-size:12px;color:var(--muted)}
.sum b{display:block;font-size:16px;color:var(--ink)}
.nag{display:flex;align-items:center;gap:10px;background:var(--warn-soft);border-radius:18px;padding:11px 14px;margin-top:12px;font-size:14px}
.nag.off{background:var(--soft);border:1px dashed var(--line);font-size:13.5px;line-height:1.6}
.empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:14px}
.empty svg{display:block;margin:0 auto 8px;width:34px;height:34px;opacity:.5}
.steps{margin:6px 0 2px;padding-inline-start:22px;font-size:14px;list-style:arabic-indic}
.steps li{margin-bottom:3px}

/* stock */
.stockbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.stockbar input{flex:1 1 100%;border-color:transparent;box-shadow:var(--shadow);border-radius:18px;padding:13px 15px}
.stockbar .sp{flex:1}
.chips{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow)}
table.rc{border-collapse:collapse;width:100%;min-width:600px;font-size:14px}
table.rc th,table.rc td{border:1px solid var(--line);padding:9px 6px;text-align:center}
table.rc tr > :first-child{border-inline-start:0}table.rc tr > :last-child{border-inline-end:0}
table.rc thead tr:first-child th{border-top:0}table.rc tfoot tr:last-child td{border-bottom:0}
table.rc th{background:var(--soft);font-weight:700;font-size:12.5px;white-space:nowrap;color:var(--muted)}
table.rc td.nm{text-align:start}
table.rc td.code{white-space:nowrap;direction:ltr;unicode-bidi:isolate;color:var(--muted)}
table.rc tbody tr{cursor:pointer}
table.rc tbody tr:active{background:var(--accent-soft)}
table.rc td.sp{font-weight:700;color:var(--accent)}
table.rc td.q.low{color:var(--warn);font-weight:700}
table.rc td.q.out{color:var(--out);font-weight:700}
table.rc tfoot td{background:var(--soft);font-weight:600;text-align:start;font-size:13px}
.brand{display:block;font-size:12px;color:var(--muted)}
@media (max-width:600px){table.rc{min-width:0;font-size:13px}table.rc th{white-space:normal;font-size:11.5px;line-height:1.25}
  table.rc th,table.rc td{padding:8px 3px}table.rc td.nm{min-width:96px;max-width:132px}.brand{font-size:11px}}

/* panel */
.scrim{position:fixed;inset:0;background:rgba(15,20,18,.32);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;bottom:0;left:0;width:min(440px,100%);background:var(--bg);z-index:21;transform:translateX(-102%);
  transition:transform .24s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 28px);box-shadow:0 0 30px rgba(0,0,0,.18)}
.panel.on{transform:none}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ph b{font-size:19px}
.f{margin-bottom:10px}
.f label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.tri{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tri input{text-align:center;font-weight:600}
.tri .hot input{border-color:var(--accent)}
.qchips{display:flex;gap:6px;margin:8px 0}
.qchips .chip{flex:1;text-align:center;padding:7px 4px}
.calc{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.lock{font-size:12px;color:var(--accent)}
.hist .h{display:flex;justify-content:space-between;font-size:13px;padding:8px 2px;border-bottom:1px solid var(--line)}
.hist .h:last-child{border-bottom:0}
.plus{color:var(--good)}.minus{color:var(--out)}

/* receive */
.sugg{border:1px solid var(--line);border-radius:14px;background:var(--card);margin-top:6px;overflow:hidden}
.sugg button{display:flex;justify-content:space-between;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px;text-align:start;font-size:14px}
.sugg button:last-child{border-bottom:0}
.lines .l{display:flex;gap:8px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
.lines .l:last-child{border-bottom:0}
.lines .l .nm{flex:1;min-width:0}
.lines .l .nm small{display:block;color:var(--muted);font-size:12px}
.match{font-size:13px;margin-top:8px}
.match.ok{color:var(--good)}.match.bad{color:var(--warn)}

/* settings */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:8px 13px;font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0}
.setrow input{width:96px;text-align:center}
.switch{width:50px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:right .18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--accent)}.switch.on::after{right:23px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stats div{background:var(--soft);border-radius:14px;padding:9px;font-size:12.5px}
.stats b{display:block;font-size:15px}
.keybox{direction:ltr;font-family:ui-monospace,monospace;background:var(--soft);border-radius:12px;padding:10px;text-align:center;font-size:15px;letter-spacing:1px;word-break:break-all}
.aa{display:flex;gap:6px}
.aa button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 0;font-weight:700;color:var(--muted)}
.aa button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* nav */
.tabs{position:fixed;left:12px;right:12px;bottom:calc(var(--sab) + 10px);height:var(--nav);max-width:560px;margin:0 auto;
  background:var(--card);border:1px solid var(--line);border-radius:24px;display:flex;z-index:10;box-shadow:0 10px 30px rgba(45,35,15,.14);padding:0 6px}
.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--muted)}
.tabs button .ic{display:grid;place-items:center;width:54px;height:30px;border-radius:999px;transition:background .15s}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--accent);font-weight:700}
.tabs button.on .ic{background:var(--accent-soft)}

.toast{position:fixed;bottom:calc(var(--nav) + var(--sab) + 22px);left:50%;transform:translate(-50%,16px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);border-radius:16px;padding:11px 16px;display:flex;gap:14px;align-items:center;z-index:30;transition:.2s;max-width:92vw;font-size:14.5px}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:var(--gold);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(15,20,18,.4);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--card);border-radius:24px;padding:20px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal .box p{margin:0 0 16px;line-height:1.7}
.modal .row{justify-content:flex-start}
</style>
</head>
<body>
<header class="top">
  <div class="hello"><div class="av" id="av"></div>
    <div style="min-width:0"><div class="greet"><span id="greet"></span><span class="sync" id="syncTag" hidden><i></i><span></span></span></div><div class="shop" id="shopName"></div></div></div>
  <button class="cloud" id="cloudBtn" title="نسخة احتياطية على Google Drive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4 4 0 0 1 .5 7.97"/><path d="M12 12v7M9 15l3-3 3 3"/></svg><span id="cloudTxt"></span></button>
</header>
<main>
  <section class="view" id="v-sell"></section>
  <section class="view" id="v-stock"></section>
  <section class="view" id="v-recv"></section>
  <section class="view" id="v-set"></section>
</main>
<nav class="tabs" id="tabs">
  <button data-v="sell"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></span>بيع</button>
  <button data-v="stock"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M9 9v11"/></svg></span>المخزن</button>
  <button data-v="recv"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11M7 9l5 5 5-5"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg></span>استلام</button>
  <button data-v="set"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></span>الإعدادات</button>
</nav>
<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel"></aside>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box"><p id="mText"></p><div id="mExtra"></div><div class="row"><button class="btn pri" id="mOk"></button><button class="btn ghost" id="mNo">إلغاء</button></div></div></div>
<input type="file" id="fileIn" hidden>

<script>
'use strict';
const SEED = /*SEED*/[];
const FIREBASE = {"apiKey": "AIzaSyCPy5fqlk_zuRNWGfHyv75R8alGxZGZjLw", "authDomain": "shop-inventory-e0b8f.firebaseapp.com", "projectId": "shop-inventory-e0b8f", "storageBucket": "shop-inventory-e0b8f.firebasestorage.app", "messagingSenderId": "69574149016", "appId": "1:69574149016:web:b96ac3959f8070db4da1ed"};
const VERSION = '2.1';

/* ---------- helpers ---------- */
const AR = '٠١٢٣٤٥٦٧٨٩', FA = '۰۱۲۳۴۵۶۷۸۹';

/* ---------- one place where the shop's data changes ----------
   ops: {t:'item', id, data} | {t:'qty', id, d} | {t:'move', m} | {t:'unmove', id} | {t:'deliv', d} | {t:'settings', data}
   Applied here right away, and sent to the shared shop when sync is on. Quantities travel as +/- so two phones never overwrite each other. */
function apply(ops) {
  for (const o of ops) {
    if (o.t === 'item') { let it = byIdAll(o.id); if (!it) { it = {id: o.id, qty: 0}; S.items.push(it); } Object.assign(it, o.data); }
    else if (o.t === 'qty') { let it = byIdAll(o.id); if (!it) { it = {id: o.id, qty: 0}; S.items.push(it); } it.qty = r2((it.qty || 0) + o.d); }
    else if (o.t === 'move') S.moves.push(o.m);
    else if (o.t === 'unmove') S.moves = S.moves.filter(m => m.id !== o.id);
    else if (o.t === 'deliv') S.deliveries.push(o.d);
    else if (o.t === 'settings') Object.assign(S.settings, o.data);
  }
  if (Cloud.live) Cloud.write(ops);
  commit();
}

/* ---------- pricing ---------- */
function roundPrice(p) {
  if (!(p > 0)) return 0;
  if (S.settings.rounding !== 'smart') return r2(p);
  const st = p < 50 ? 1 : p < 500 ? 5 : 10;
  return Math.ceil(p / st - 1e-9) * st;
}
const priceFrom = (cost, mk) => roundPrice(cost * (1 + mk / 100));
const realMk = (cost, price) => cost > 0 ? (price - cost) / cost * 100 : 0;
const stat = it => it.qty <= 0 ? 'out' : (S.settings.low > 0 && it.qty <= S.settings.low ? 'low' : 'ok');
const statTag = it => { const s = stat(it); return s === 'out' ? '<span class="tag out">نفد</span>' : s === 'low' ? '<span class="tag low">قليل</span>' : ''; };
const live = () => S.items.filter(i => !i.archived && i.code);
const byId = id => S.items.find(i => i.id === id);
const byIdAll = byId;

function seed() {
  S = blank();
  const t0 = Date.now();
  SEED.forEach((r, i) => {
    const [code, name, brand, qty, cost] = r;
    const it = {id: uid() + i, code, name: toAr(name), brand, qty, cost, markup: 25, price: 0, locked: false, archived: false, added: t0 + i};
    it.price = priceFrom(cost, 25);
    S.items.push(it);
    S.moves.push({id: uid() + 'm' + i, item: it.id, type: 'in', qty, price: cost, at: t0, ref: i < 53 ? '3115' : '3117'});
  });
  S.deliveries.push({id: uid(), inv: '3115', supplier: '', at: t0, lines: 53, total: 39495.25}, {id: uid(), inv: '3117', supplier: '', at: t0, lines: 4, total: 7133});
  saveNow();
}

/* ---------- shared shop (Firebase) ---------- */
const Cloud = {
  live: false, key: null, db: null, F: null, unsub: [], state: 'off', got: {}, firstServer: null,
  available: () => !!FIREBASE,
  async load() {
    if (window.FBSDK) return (this.F = window.FBSDK);
    await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'fb.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
    return (this.F = window.FBSDK);
  },
  async connect(key) {
    const F = await this.load();
    if (!this.db) {
      const app = F.initializeApp(FIREBASE);
      this.auth = F.initializeAuth(app, {persistence: [F.indexedDBLocalPersistence, F.browserLocalPersistence]});
      this.db = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentSingleTabManager()})});
    }
    if (this.auth.authStateReady) await this.auth.authStateReady();   // restores the saved sign-in, works offline
    if (!this.auth.currentUser) {
      try { await F.signInAnonymously(this.auth); }
      catch (e) { if (navigator.onLine) throw e; window.addEventListener('online', () => F.signInAnonymously(this.auth).catch(() => {}), {once: true}); }
    }
    this.key = key; this.live = true; this.got = {};
    let resolveFirst; this.firstServer = new Promise(r => resolveFirst = r);
    const col = n => F.collection(this.db, 'shops', key, n);
    const opts = {includeMetadataChanges: true};
    const onCol = name => snap => {
      const rows = snap.docs.map(d => Object.assign({id: d.id}, d.data()));
      if (name === 'items') S.items = rows; else if (name === 'moves') S.moves = rows; else S.deliveries = rows;
      this.got[name] = snap.metadata;
      this.changed(); if (!snap.metadata.fromCache) this.got[name + 'Srv'] = true;
      if (this.got.itemsSrv && this.got.movesSrv && this.got.deliveriesSrv) resolveFirst(true);
    };
    this.unsub = [
      F.onSnapshot(col('items'), opts, onCol('items')),
      F.onSnapshot(col('moves'), opts, onCol('moves')),
      F.onSnapshot(col('deliveries'), opts, onCol('deliveries')),
      F.onSnapshot(F.doc(this.db, 'shops', key, 'meta', 'settings'), opts, snap => {
        if (snap.exists()) { const d = snap.data(); for (const k of ['shop', 'markup', 'rounding', 'low']) if (d[k] !== undefined) S.settings[k] = d[k];
          if (d.shop === 'المحل' && !snap.metadata.fromCache) { S.settings.shop = 'الطارق'; this.write([{t: 'settings', data: {shop: 'الطارق'}}]); } }
        this.got.settings = snap.metadata; this.changed();
      })
    ];
    window.addEventListener('online', () => this.changed()); window.addEventListener('offline', () => this.changed());
  },
  disconnect() { this.unsub.forEach(u => { try { u(); } catch (_) {} }); this.unsub = []; this.live = false; this.key = null; },
  status() {
    if (!this.live) return 'off';
    const m = Object.values(this.got).filter(x => typeof x === 'object');
    if (m.some(x => x.hasPendingWrites)) return 'wait';
    if (!navigator.onLine || m.some(x => x.fromCache)) return 'offline';
    return 'ok';
  },
  write(ops) {
    const F = this.F, b = F.writeBatch(this.db), d = (c, id) => F.doc(this.db, 'shops', this.key, c, id);
    for (const o of ops) {
      if (o.t === 'item') b.set(d('items', o.id), clean(o.data), {merge: true});
      else if (o.t === 'qty') b.set(d('items', o.id), {qty: F.increment(o.d)}, {merge: true});
      else if (o.t === 'move') b.set(d('moves', o.m.id), clean(o.m));
      else if (o.t === 'unmove') b.delete(d('moves', o.id));
      else if (o.t === 'deliv') b.set(d('deliveries', o.d.id), clean(o.d));
      else if (o.t === 'settings') b.set(F.doc(this.db, 'shops', this.key, 'meta', 'settings'), clean(o.data), {merge: true});
    }
    b.commit().catch(e => toast('تعذّر الحفظ في المحل المشترك'));
  },
  async uploadAll(data) {   // copy a full dataset into the shared shop (first phone / restore)
    const F = this.F, all = [];
    for (const it of data.items) all.push(['items', it.id, it]);
    for (const m of data.moves) all.push(['moves', m.id, m]);
    for (const x of data.deliveries) { if (!x.id) x.id = uid(); all.push(['deliveries', x.id, x]); }
    // writes are queued on the phone first, so this also works with weak internet
    const b0 = F.writeBatch(this.db); b0.set(F.doc(this.db, 'shops', this.key, 'meta', 'settings'), clean(data.settings), {merge: true}); b0.commit().catch(() => {});
    for (let i = 0; i < all.length; i += 400) {
      const b = F.writeBatch(this.db);
      for (const [c, id, v] of all.slice(i, i + 400)) b.set(F.doc(this.db, 'shops', this.key, c, id), clean(v));
      b.commit().catch(() => toast('تعذّر رفع بعض البيانات'));
    }
  },
  changeT: null,
  changed() { clearTimeout(this.changeT); this.changeT = setTimeout(() => { if (this.status() === 'ok') S.local.lastSync = Date.now(); save(); softRender(); }, 60); }
};
const clean = o => { const x = {}; for (const [k, v] of Object.entries(o)) if (v !== undefined && k !== 'id') x[k] = v; return x; };
let pendingRender = false;
function softRender() {   // don't disturb someone who is typing

function ask(msg, ok = 'تأكيد', danger = false, extra = '') {
  return new Promise(res => {
    $('mText').textContent = msg; $('mExtra').innerHTML = extra; const b = $('mOk'); b.textContent = ok;
    b.className = 'btn ' + (danger ? 'danger' : 'pri'); $('modal').classList.add('on');
    const done = v => { const val = $('mIn') ? $('mIn').value : null; $('modal').classList.remove('on'); res(v ? (val ?? true) : false); };
    b.onclick = () => done(true); $('mNo').onclick = () => done(false);
  });

function search(q, limit = 8) {
  const n = norm(q); if (!n) return [];
  const toks = n.split(' '), out = [];
  for (const it of live()) {
    const c = norm(it.code), nm = norm(it.name + ' ' + it.brand);
    let score = -1;
    if (c === n) score = 0; else if (c.startsWith(n)) score = 1; else if (c.includes(n)) score = 2;
    else if (toks.every(t => nm.includes(t) || c.includes(t))) score = 3;
    if (score >= 0) out.push([score, it]);
  }
  return out.sort((a, b) => a[0] - b[0] || a[1].name.localeCompare(b[1].name, 'ar')).slice(0, limit).map(x => x[1]);
}

    if (it) {
      id = it.id; const data = {archived: false};
      if (Math.abs(l.cost - it.cost) > 0.001) { data.cost = l.cost; if (it.locked) data.markup = r2(realMk(l.cost, it.price)); else data.price = priceFrom(l.cost, it.markup); }
      ops.push({t: 'item', id, data});
    } else {
      id = uid();
      ops.push({t: 'item', id, data: {code: l.code, name: l.name, brand: l.brand, cost: l.cost, markup: S.settings.markup, price: priceFrom(l.cost, S.settings.markup), locked: false, archived: false, added: at + i}});
    }
    ops.push({t: 'qty', id, d: l.qty}, {t: 'move', m: {id: uid(), item: id, type: 'in', qty: l.qty, price: l.cost, at, ref: d.inv}});
  });
  ops.push({t: 'deliv', d: {id: uid(), inv: d.inv, supplier: d.supplier, at, lines: d.lines.length, total: r2(tot)}});
  const n = d.lines.length;
  S.draft = {inv: '', supplier: d.supplier, paper: '', lines: []};
  apply(ops); toast(`تمت إضافة ${fm(n)} صنف للمخزن`);
}

/* --- settings --- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (view === 'set') render(); });
function stats(days) {
  const t0 = days === 1 ? dayStart() : dayStart() - (days - 1) * DAY;
  const l = S.moves.filter(m => m.type === 'sale' && m.at >= t0);
  return {rev: l.reduce((a, m) => a + m.qty * m.price, 0), pr: l.reduce((a, m) => a + m.qty * (m.price - (m.cost ?? 0)), 0)};
}
function syncCard() {
  if (!Cloud.available()) return '';
  if (!Cloud.live) return `<h3>جهازان على نفس المخزن</h3><div class="card stack">
      <div class="small">لو أكثر من شخص يبيع، اربطوا الأجهزة بنفس المحل. كل جهاز يعمل بدون إنترنت، والمبيعات تتجمع تلقائيًا عند الاتصال.</div>
      <button class="btn pri wide" id="sCreate">إنشاء محل مشترك من هذا الجهاز</button>
      <button class="btn wide" id="sJoin">الانضمام بمفتاح المحل</button></div>`;
  const st = Cloud.status();
  return `<h3>جهازان على نفس المخزن</h3><div class="card stack">
      <div class="setrow"><span>الحالة</span><span class="sync ${st === 'ok' ? 'ok' : st === 'wait' ? 'wait' : ''}"><i></i>${st === 'ok' ? 'متزامن' : st === 'wait' ? 'جارٍ الرفع' : 'بدون إنترنت — سيُرفع لاحقًا'}</span></div>
      <div class="small muted">مفتاح المحل (أرسله للجهاز الثاني):</div><div class="keybox">${esc(Cloud.key)}</div>
      <button class="btn pri wide" id="sShareKey">إرسال المفتاح</button>
      <button class="btn wide danger" id="sLeave">فصل هذا الجهاز</button></div>`;
}
function renderSet() {
  const st = S.settings, lo = S.local, el = $('v-set');
  const lb = lo.lastBackup ? DF.format(lo.lastBackup) : '—';
  el.innerHTML = `<div class="card"><div class="f" style="margin:0"><label>اسم المحل</label><input id="sShop" value="${esc(st.shop)}"></div></div>
    <h3>حجم الخط</h3><div class="card"><div class="aa" id="sScale">${[[0.9, 'صغير', 14], [1, 'عادي', 16], [1.12, 'كبير', 18], [1.25, 'أكبر', 20]].map(([v, l, px]) => `<button data-s="${v}" style="font-size:${px}px">${l}</button>`).join('')}</div></div>
    <h3>التسعير</h3><div class="card">
      <div class="setrow"><span>نسبة الربح للأصناف الجديدة</span><input id="sMk" inputmode="decimal" value="${fm(st.markup)}"></div>
      <div class="setrow"><span>تقريب سعر البيع</span><div class="seg" id="sRound"><button data-r="smart">ذكي</button><button data-r="none">بدون</button></div></div>
      <div class="small muted">ذكي: يقرّب لأعلى — أقل من ٥٠ ج لأقرب جنيه، حتى ٥٠٠ ج لأقرب ٥، وأكثر لأقرب ١٠.</div>
      <div class="setrow"><span>إظهار سعر الشراء والربح عند البيع</span><button class="switch ${lo.showCost ? 'on' : ''}" id="sCost" aria-label="إظهار سعر الشراء"></button></div></div>
    <h3>المخزن</h3><div class="card">
      <div class="setrow"><span>علامة "قليل" عندما تصل الكمية إلى</span><input id="sLow" inputmode="numeric" value="${fm(st.low)}"></div>
      <div class="small muted">اكتب صفر لإظهار علامة "نفد" فقط.</div></div>
    <h3>ملخص المبيعات</h3><div class="card">
      <div class="setrow"><span>إظهار المبالغ والأرباح</span><button class="switch ${lo.showMoney ? 'on' : ''}" id="sMoney" aria-label="إظهار المبالغ"></button></div>
      ${lo.showMoney ? `<div class="stats">${[[1, 'اليوم'], [7, '٧ أيام'], [30, '٣٠ يوم']].map(([d, l]) => { const s = stats(d);
        return `<div>${l}<b>${fm(s.rev)} ج</b><span class="muted">ربح ${fm(s.pr)} ج</span></div>`; }).join('')}</div>` : '<div class="small muted">مخفية. يمكن إظهارها من هنا أو من زر العين في شاشة البيع.</div>'}</div>
    ${syncCard()}
    <h3>النسخ الاحتياطي على Google Drive</h3><div class="card stack">
      <div class="small">كل شيء محفوظ على هذا الجهاز تلقائيًا. لحفظ نسخة على السحابة:</div>
      <ol class="steps"><li>اضغط «حفظ نسخة» بالأسفل (أو زر <b>Drive</b> أعلى الشاشة)</li><li>اختر <b>Drive</b> من القائمة</li><li>اضغط <b>حفظ</b></li></ol>
      <div class="small muted">آخر نسخة: ${lb}</div>
      <button class="btn pri wide" id="sBackup">${ICON.cloud}حفظ نسخة على Google Drive</button>
      <button class="btn wide" id="sRestore">استرجاع من نسخة</button>
      <button class="btn wide" id="sCsv">تصدير الجدول إلى Excel</button></div>
    <h3>التطبيق</h3><div class="card stack">
      ${installEvt ? '<button class="btn pri wide" id="sInstall">تثبيت على الشاشة الرئيسية</button>' : ''}
      <button class="btn danger wide" id="sWipe">مسح كل البيانات من هذا الجهاز</button>
      <div class="small muted" style="text-align:center">الإصدار ${toAr(VERSION)}</div></div>`;
  const shared = data => apply([{t: 'settings', data}]);
  $('sShop').onchange = e => shared({shop: e.target.value.trim() || 'الطارق'});
  $('sMk').onchange = e => { const v = num(e.target.value); if (v >= 0) shared({markup: v}); };
  $('sLow').onchange = e => { const v = Math.floor(num(e.target.value)); if (v >= 0) shared({low: v}); };
  $('sRound').querySelectorAll('button').forEach(b => { b.classList.toggle('on', b.dataset.r === st.rounding); b.onclick = () => shared({rounding: b.dataset.r}); });
  $('sScale').querySelectorAll('button').forEach(b => { b.classList.toggle('on', +b.dataset.s === (lo.scale || 1)); b.onclick = () => { lo.scale = +b.dataset.s; save(); render(); }; });
  $('sMoney').onclick = () => { lo.showMoney = !lo.showMoney; save(); renderSet(); };
  $('sCost').onclick = () => { lo.showCost = !lo.showCost; save(); renderSet(); };
  $('sBackup').onclick = backup;
  $('sRestore').onclick = () => $('fileIn').click();
  $('sCsv').onclick = exportCsv;
  if ($('sCreate')) $('sCreate').onclick = createShop;
  if ($('sJoin')) $('sJoin').onclick = joinShop;
  if ($('sShareKey')) $('sShareKey').onclick = shareKey;
  if ($('sLeave')) $('sLeave').onclick = leaveShop;
  if ($('sInstall')) $('sInstall').onclick = async () => { installEvt.prompt(); await installEvt.userChoice; installEvt = null; renderSet(); };
  $('sWipe').onclick = async () => {
    if (!await ask('سيتم مسح كل الأصناف والمبيعات من هذا الجهاز. هل حفظت نسخة احتياطية؟', 'متابعة', true)) return;
    if (!await ask('تأكيد أخير: مسح كل البيانات من هذا الجهاز؟', 'مسح', true)) return;
    Cloud.disconnect(); S = blank(); saveNow(); render(); toast('تم مسح البيانات');
  };
}

/* --- shared shop actions --- */
async function createShop() {
  if (!await ask('سيصبح هذا الجهاز هو الأساسي وتُرفع أصنافه للمحل المشترك. بعدها أرسل المفتاح للجهاز الثاني.', 'إنشاء')) return;
  if (!navigator.onLine) { toast('يحتاج اتصال بالإنترنت لأول مرة'); return; }
  const data = JSON.parse(JSON.stringify(S));
  try {
    toast('جارٍ التجهيز…');
    const key = newKey();
    await Cloud.connect(key);
    S.local.sync = {key}; saveNow();
    await Cloud.uploadAll(data);
    render(); toast('تم إنشاء المحل المشترك');
    shareKey();
  } catch (e) { Cloud.disconnect(); S = data; S.local.sync = null; saveNow(); render(); toast('تعذّر الاتصال — تأكد من الإنترنت'); }
}
async function joinShop() {
  const key = await ask('اكتب أو الصق مفتاح المحل من الجهاز الأول. سيتم استبدال بيانات هذا الجهاز ببيانات المحل.', 'انضمام', false,
    '<input id="mIn" dir="ltr" autocomplete="off" style="margin-bottom:14px;font-family:monospace" placeholder="مفتاح المحل">');
  if (!key || String(key).trim().length < 20) { if (key) toast('المفتاح غير صحيح'); return; }
  const before = JSON.parse(JSON.stringify(S)), undo = msg => { Cloud.disconnect(); S = before; S.local.sync = null; saveNow(); render(); toast(msg); };
  try {
    toast('جارٍ الاتصال…');
    await Cloud.connect(String(key).trim());
    const ok = await Promise.race([Cloud.firstServer, new Promise(r => setTimeout(() => r(false), 15000))]);
    if (!ok) return undo('لا يوجد اتصال بالإنترنت — حاول مرة أخرى');
    if (!S.items.length) return undo('لا يوجد محل بهذا المفتاح');
    S.local = before.local; S.local.sync = {key: Cloud.key}; S.draft = before.draft; saveNow(); go('sell'); toast('تم الانضمام — الأصناف ظاهرة الآن');
  } catch (e) { undo('تعذّر الاتصال — تأكد من الإنترنت'); }
}
function shareKey() {
  const txt = 'مفتاح المحل لتطبيق المخزن:\n' + Cloud.key;
  if (navigator.share) navigator.share({text: txt}).catch(() => {});
  else if (window.Capacitor && Capacitor.Plugins.Share) Capacitor.Plugins.Share.share({text: txt}).catch(() => {});
  else navigator.clipboard.writeText(Cloud.key).then(() => toast('تم نسخ المفتاح'));
}
async function leaveShop() {
  if (!await ask('فصل هذا الجهاز عن المحل المشترك؟ تبقى نسخة من البيانات على الجهاز، لكنها لن تتحدث بعد ذلك.', 'فصل', true)) return;
  Cloud.disconnect(); S.local.sync = null; saveNow(); render(); toast('تم الفصل');
}

/* --- files --- */
const stamp = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
async function shareFile(blob, name, title) {
  const cap = window.Capacitor;
  if (cap && cap.isNativePlatform && cap.isNativePlatform() && cap.Plugins.Filesystem && cap.Plugins.Share) {
    try {
      const w = await cap.Plugins.Filesystem.writeFile({path: name, data: await blob.text(), directory: 'CACHE', encoding: 'utf8'});
      await cap.Plugins.Share.share({title, url: w.uri, dialogTitle: title});
      return true;
    } catch (e) { if (/cancel/i.test(String(e && (e.message || e)))) return false; toast('تعذّرت المشاركة'); return false; }
  }
  const file = new File([blob], name, {type: blob.type});
  if (navigator.canShare && navigator.canShare({files: [file]})) {
    try { await navigator.share({files: [file], title}); return true; } catch (e) { if (e.name === 'AbortError') return false; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); return true;
}
async function backup() {
  if (!S.local.driveHint) {
    if (!await ask('ستظهر قائمة المشاركة: اختر Drive ثم اضغط حفظ. (يمكنك أيضًا إرسالها لنفسك على واتساب)', 'متابعة')) return;
    S.local.driveHint = true;
  }
  saveNow();
  const data = {v: 2, items: S.items, moves: S.moves, deliveries: S.deliveries, settings: S.settings};
  const blob = new Blob([JSON.stringify({app: 'shop-inventory', v: 2, at: Date.now(), data})], {type: 'application/json'});
  if (await shareFile(blob, `shop-backup-${stamp()}.json`, 'نسخة احتياطية')) {
    S.local.lastBackup = Date.now(); S.local.dirty = false; save(); render(); toast('تم حفظ النسخة الاحتياطية');
  }
}
$('cloudBtn').onclick = backup;
$('fileIn').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (j.app !== 'shop-inventory' || !j.data || !Array.isArray(j.data.items)) throw 0;
    const n = j.data.items.filter(i => !i.archived).length;
    if (Cloud.live) {
      if (!await ask(`رفع هذه النسخة (${fm(n)} صنف) إلى المحل المشترك؟ ستظهر على كل الأجهزة.`, 'رفع')) return;
      await Cloud.uploadAll(normalize(j.data)); toast('تم رفع النسخة'); return;
    }
    if (live().length && !await ask(`استبدال البيانات الحالية بنسخة ${DF.format(j.at)} (${fm(n)} صنف)؟`, 'استرجاع')) return;
    const local = S.local; S = normalize(j.data); S.local = Object.assign(local, {sync: null});
    S.items.forEach((it, i) => { if (!it.added) it.added = i; });
    saveNow(); render(); toast('تم الاسترجاع');
  } catch (_) { toast('الملف غير صالح'); }
};
function exportCsv() {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = [['م', 'كود الصنف', 'اسم الصنف', 'الماركة', 'الكمية', 'سعر الشراء', 'سعر البيع', 'نسبة الربح']]
    .concat(live().sort((a, b) => (a.added || 0) - (b.added || 0)).map((it, i) => [i + 1, it.code, it.name, it.brand, it.qty, it.cost, it.price, r2(realMk(it.cost, it.price))]));
  shareFile(new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\r\n')], {type: 'text/csv'}), `stock-${stamp()}.csv`, 'جدول المخزن');
}

/* ---------- start ---------- */
(async () => {
  try { await DB.open(); S = await DB.get('state'); }
  catch (_) { useLS = true; try { S = JSON.parse(localStorage.getItem('shop-state')); } catch (e) { S = null; } }
  if (!S) { if (SEED.length) seed(); else { S = blank(); saveNow(); } }
  else S = normalize(S);
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  render();
  if (S.local.sync && S.local.sync.key && Cloud.available()) Cloud.connect(S.local.sync.key).then(render).catch(() => {});
  if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform()))
    navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
